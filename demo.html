<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>飞奕网关调试</title>
  <link rel="stylesheet" href="_base.css">
  <style>
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #e7ecf3;
      color: var(--text-primary);
    }
    .demo-stage {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .demo-launch {
      position: relative;
      width: min(100%, 390px);
      min-height: min(760px, calc(100vh - 48px));
      min-height: min(760px, calc(100svh - 48px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid rgba(31, 52, 84, 0.08);
      border-radius: 24px;
      box-shadow: 0 28px 72px rgba(31, 52, 84, 0.16), 0 6px 18px rgba(31, 52, 84, 0.08);
    }
    .launch-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: max(18px, env(safe-area-inset-top)) 22px 10px;
    }
    .brand-logo {
      display: block;
      width: 106px;
      height: 42px;
      object-fit: contain;
      object-position: left center;
    }
    .mini-capsule {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border: 1px solid #d8dde7;
      border-radius: 15px;
      color: #465267;
    }
    .mini-capsule span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
    }
    .mini-capsule i {
      display: block;
      width: 1px;
      height: 13px;
      margin: 0 3px;
      background: #d8dde7;
    }
    .mini-capsule b {
      display: block;
      width: 9px;
      height: 9px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
    }
    .launch-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 32px 44px;
    }
    .product-mark {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
      background: #f2f6fc;
      border: 1px solid #e0e8f4;
      border-radius: 8px;
    }
    .product-mark img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .launch-kicker {
      margin: 0 0 9px;
      color: #526077;
      font-size: 13px;
      font-weight: 600;
    }
    .launch-title {
      margin: 0;
      color: #17243a;
      font-size: 30px;
      font-weight: 760;
      line-height: 1.24;
      letter-spacing: 0;
    }
    .launch-subtitle {
      margin: 13px 0 0;
      color: #68758a;
      font-size: 15px;
      line-height: 1.6;
    }
    .launch-foot {
      padding: 0 24px max(26px, calc(env(safe-area-inset-bottom) + 18px));
    }
    .launch-action {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 8px;
      background: var(--fy-blue);
      color: #ffffff;
      font-size: 16px;
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(36, 87, 214, 0.22);
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .launch-action:hover {
      background: var(--fy-blue-deep);
      box-shadow: 0 12px 28px rgba(36, 87, 214, 0.28);
      transform: translateY(-1px);
    }
    .launch-action:active {
      transform: translateY(1px);
      box-shadow: 0 6px 14px rgba(36, 87, 214, 0.2);
    }
    .launch-action:focus-visible {
      outline: 3px solid rgba(36, 87, 214, 0.25);
      outline-offset: 3px;
    }
    .launch-action .arrow {
      font-size: 19px;
      line-height: 1;
    }
    .company-line {
      margin-top: 15px;
      color: #8c97a9;
      font-size: 11px;
      text-align: center;
    }
    @media (max-width: 520px) {
      body { background: #ffffff; }
      .demo-stage { display: block; padding: 0; }
      .demo-launch {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .launch-head { padding-left: 20px; padding-right: 20px; }
      .launch-main { padding-left: 28px; padding-right: 28px; }
      .launch-foot { padding-left: 20px; padding-right: 20px; }
    }
    @media (max-height: 660px) {
      .demo-launch { min-height: calc(100svh - 24px); }
      .launch-main { padding-top: 18px; padding-bottom: 24px; }
      .product-mark { width: 72px; height: 72px; margin-bottom: 20px; }
      .product-mark img { width: 52px; height: 52px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .product-mark, .launch-kicker, .launch-title, .launch-subtitle, .launch-foot {
        animation: launch-rise .42s ease both;
      }
      .launch-kicker { animation-delay: .04s; }
      .launch-title { animation-delay: .08s; }
      .launch-subtitle { animation-delay: .12s; }
      .launch-foot { animation-delay: .16s; }
      @keyframes launch-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="demo-stage">
    <section class="demo-launch" id="demo-launch" aria-labelledby="launch-title">
      <header class="launch-head">
        <img class="brand-logo" src="assets/logo/LOGO-彩色.png" alt="飞奕">
        <div class="mini-capsule" aria-hidden="true">
          <span></span><span></span><span></span><i></i><b></b>
        </div>
      </header>

      <div class="launch-main">
        <div class="product-mark" aria-hidden="true">
          <img src="assets/logo/飞奕logo-纯图形-原色-1v1.png" alt="">
        </div>
        <p class="launch-kicker">飞奕工程服务</p>
        <h1 class="launch-title" id="launch-title">飞奕网关调试</h1>
        <p class="launch-subtitle">网关调试小程序</p>
      </div>

      <footer class="launch-foot">
        <a class="launch-action" href="pages/tab-device-bt.html">
          <span>进入小程序</span><span class="arrow" aria-hidden="true">→</span>
        </a>
        <div class="company-line">飞奕科技</div>
      </footer>
    </section>
  </main>
</body>
</html>
