<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>空调管理</title><link rel="stylesheet" href="../assets/app/app.css"></head>
<body>
  <main class="app-shell workbench" id="ac-page">
    <div class="statusbar"><span>17:41</span><span class="status-icons">● ● 68%</span></div>
    <div class="wb-hero-zone"><div class="hero-float-row"><button class="hero-back-pill" id="nav-back" type="button" aria-label="返回">‹</button><button class="hero-menu-float" id="menu-trigger" type="button" aria-label="打开菜单"><span class="hero-menu-icon">☰</span><span class="hero-menu-label">更多功能</span></button><div class="capsule">··· ○</div></div><div class="wb-hero-title">空调管理</div></div>
    <div class="page no-tab ac-page-body">
      <div class="channel-tabs" id="channel-tabs"></div>
      <section class="ac-toolbar card"><label class="check-action"><input id="select-all" type="checkbox"><span>全选</span></label><div><button class="text-button" id="all-on" type="button">全开</button><button class="text-button danger-text" id="all-off" type="button">全关</button></div></section>
      <div id="ac-groups"></div>
    </div>
    <div class="selection-bar" id="selection-bar"><span id="selection-count">已选 0 台</span><button class="button primary" id="batch-control" type="button">批量控制</button></div>
    <div class="sheet-mask" id="control-mask"></div>
    <section class="control-sheet" id="control-sheet">
      <div class="sheet-handle"></div><div class="sheet-heading"><div><h2>空调控制</h2><p id="control-target">内机 01</p></div><button class="sheet-close" id="sheet-close" type="button" aria-label="关闭">×</button></div>
      <div class="control-sheet-body"><div class="temp-stepper"><button id="temp-down" type="button">−</button><strong><span id="temp-value">26</span><small>℃</small></strong><button id="temp-up" type="button">+</button></div>
        <div class="control-section"><span>运行模式</span><div class="chip-row" data-chip-group><button class="chip active" type="button">制冷</button><button class="chip" type="button">制热</button><button class="chip" type="button">除湿</button><button class="chip" type="button">送风</button><button class="chip" type="button">自动</button></div></div>
        <div class="control-section"><span>风速</span><div class="chip-row" data-chip-group><button class="chip active" type="button">自动</button><button class="chip" type="button">低</button><button class="chip" type="button">中</button><button class="chip" type="button">高</button></div></div>
        <label class="control-power switch-field"><span>空调开关</span><input id="control-power" type="checkbox" checked><i></i></label>
      </div><button class="button primary sheet-confirm" id="send-control" type="button">确定</button>
    </section>
    <div class="side-menu-overlay" id="side-menu-overlay"></div><aside class="side-menu-panel" id="side-menu" aria-label="设备功能"></aside>
    <div class="toast" id="toast"></div>
  </main>
  <script src="../assets/app/product-data.js"></script><script src="../assets/app/connection-state.js"></script><script src="../assets/app/workbench.js"></script>
  <script>
  (function () {
    var context = window.GWDBG_WORKBENCH, product = context.product;
    var host = document.getElementById('ac-groups'), channels = product.channels || 1;
    var unitsPerChannel = product.family === 'indoor' ? 1 : 8;
    var activeChannel = 1;
    var powerState = {};
    var selectedIds = [];
    var cards = [];

    function unitIcon() {
      if (product.family === 'fd01g') return '<div class="unit-machine"><i></i></div>';
      if (product.model === 'F16G' || product.model === 'F17G') return '<img class="unit-type-icon" src="../assets/products/fancoil.svg" alt="风机盘管">';
      return '<img class="unit-type-icon" src="../assets/products/neiji.png" alt="多联机内机">';
    }
    function unitId(channel, unit) { return String((channel - 1) * unitsPerChannel + unit).padStart(2, '0'); }
    function unitCard(channel, unit) {
      var id = unitId(channel, unit);
      var on = powerState[id] !== false;
      return '<article class="indoor-card" data-unit="' + id + '"><div class="indoor-card-top"><label class="unit-check"><input type="checkbox"><span></span></label><b class="unit-power' + (on ? ' on' : '') + '">' + (on ? '开' : '关') + '</b></div><div class="unit-visual">' + unitIcon() + '<strong>内机 ' + id + '</strong><small>地址 ' + id + '</small></div><div class="unit-state"><strong>26℃</strong><span>回风 24.8℃</span><span>制冷 · 自动风</span></div><div class="unit-actions"><button class="small-button unit-control" type="button">控制</button></div></article>';
    }

    var tabsHost = document.getElementById('channel-tabs');
    function renderTabs() {
      if (channels < 2) { tabsHost.hidden = true; return; }
      tabsHost.innerHTML = '';
      for (var channel = 1; channel <= channels; channel += 1) {
        tabsHost.innerHTML += '<button class="channel-tab' + (channel === activeChannel ? ' active' : '') + '" data-channel="' + channel + '" type="button">通道 ' + channel + '</button>';
      }
    }

    var selectAll = document.getElementById('select-all');
    function updateSelection() {
      cards.forEach(function (card) {
        var checked = selectedIds.indexOf(card.dataset.unit) >= 0;
        card.querySelector('input').checked = checked;
        card.classList.toggle('selected', checked);
      });
      document.getElementById('selection-count').textContent = '已选 ' + selectedIds.length + ' 台';
      document.getElementById('selection-bar').classList.toggle('show', selectedIds.length > 0);
      selectAll.checked = cards.length > 0 && selectedIds.length === cards.length;
      selectAll.indeterminate = selectedIds.length > 0 && selectedIds.length < cards.length;
    }
    function renderUnits() {
      var html = '<div class="indoor-grid">';
      for (var unit = 1; unit <= unitsPerChannel; unit += 1) html += unitCard(activeChannel, unit);
      host.innerHTML = html + '</div>';
      cards = Array.from(host.querySelectorAll('.indoor-card'));
      cards.forEach(function (card) {
        card.querySelector('.unit-check input').onchange = function () {
          var id = card.dataset.unit;
          var index = selectedIds.indexOf(id);
          if (index >= 0) selectedIds.splice(index, 1);
          else selectedIds.push(id);
          updateSelection();
        };
        card.querySelector('.unit-control').onclick = function () { openControl([card.dataset.unit]); };
      });
      updateSelection();
    }

    tabsHost.addEventListener('click', function (event) {
      var tab = event.target.closest('[data-channel]');
      if (!tab) return;
      activeChannel = +tab.dataset.channel;
      selectedIds = [];
      renderTabs();
      renderUnits();
    });

    selectAll.onchange = function () {
      selectedIds = selectAll.checked ? cards.map(function (card) { return card.dataset.unit; }) : [];
      updateSelection();
    };
    function setAll(on) {
      cards.forEach(function (card) { powerState[card.dataset.unit] = on; });
      renderUnits();
      showToast('通道 ' + activeChannel + ' 内机已全部' + (on ? '开启' : '关闭'));
    }
    document.getElementById('all-on').onclick = function () { setAll(true); };
    document.getElementById('all-off').onclick = function () { setAll(false); };
    document.getElementById('batch-control').onclick = function () { openControl(selectedIds.slice()); };

    var sheet = document.getElementById('control-sheet'), mask = document.getElementById('control-mask'), targets = [];
    function openControl(nextTargets) { targets = nextTargets; document.getElementById('control-target').textContent = targets.length > 1 ? targets.length + ' 台内机' : '内机 ' + targets[0]; sheet.classList.add('show'); mask.classList.add('show'); }
    function closeControl() { sheet.classList.remove('show'); mask.classList.remove('show'); }
    mask.onclick = closeControl; document.getElementById('sheet-close').onclick = closeControl;
    document.querySelectorAll('[data-chip-group]').forEach(function (group) { group.onclick = function (event) { var chip = event.target.closest('.chip'); if (!chip) return; group.querySelectorAll('.chip').forEach(function (item) { item.classList.toggle('active', item === chip); }); }; });
    document.getElementById('temp-down').onclick = function () { var value = document.getElementById('temp-value'); value.textContent = Math.max(16, +value.textContent - 1); };
    document.getElementById('temp-up').onclick = function () { var value = document.getElementById('temp-value'); value.textContent = Math.min(30, +value.textContent + 1); };
    document.getElementById('send-control').onclick = function () { var on = document.getElementById('control-power').checked; targets.forEach(function (id) { powerState[id] = on; }); closeControl(); renderUnits(); showToast('控制指令已下发'); };
    function showToast(message) { var toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(function () { toast.classList.remove('show'); }, 1500); }

    renderTabs();
    renderUnits();
  })();
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
</body></html>
