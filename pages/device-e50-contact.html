<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>联系我们</title><link rel="stylesheet" href="../assets/app/app.css"></head>
<body>
  <main class="app-shell" id="e50-contact">
    <div class="statusbar"><span>14:14</span><span class="status-icons">● ● 77%</span></div>
    <header class="topbar"><button class="back" id="nav-back" type="button" aria-label="返回">‹</button><div class="topbar-title">联系我们</div><div class="capsule">··· ○</div></header>
    <div class="page contact-body">
      <section class="card contact-field">
        <div class="contact-label-row"><span class="contact-label">问题描述</span><span class="contact-count" id="desc-count">0/200</span></div>
        <textarea class="contact-textarea" id="desc" placeholder="请输入" maxlength="200"></textarea>
      </section>
      <section class="card contact-field">
        <div class="contact-label-row"><span class="contact-label">图片（选填，提供问题截图）</span><span class="contact-count">0/1</span></div>
        <button class="contact-img-add" id="img-add" type="button">＋</button>
      </section>
      <section class="card contact-field">
        <div class="contact-label-row"><span class="contact-label">姓名</span></div>
        <input class="contact-input" id="name" placeholder="请输入姓名">
      </section>
      <section class="card contact-field">
        <div class="contact-label-row"><span class="contact-label">联系方式（请填写手机号）</span></div>
        <input class="contact-input" id="phone" type="tel" placeholder="请输入手机号">
      </section>
      <button class="button primary contact-submit" id="submit" type="button">提交</button>
    </div>
    <div class="toast" id="toast"></div>
  </main>
  <script src="../assets/app/connection-state.js"></script><script src="../assets/app/e50.js"></script>
  <script>
  (function () {
    var E = window.GWDBG_E50;
    var desc = document.getElementById('desc');
    desc.addEventListener('input', function () {
      document.getElementById('desc-count').textContent = desc.value.length + '/200';
    });
    document.getElementById('img-add').onclick = function () { E.toast('请选择图片'); };
    document.getElementById('submit').onclick = function () {
      if (!desc.value.trim()) { E.toast('请填写问题描述'); return; }
      if (!document.getElementById('phone').value.trim()) { E.toast('请填写手机号'); return; }
      E.toast('已提交，我们会尽快联系您');
      desc.value = '';
      document.getElementById('desc-count').textContent = '0/200';
    };
    document.getElementById('nav-back').onclick = function () {
      if (history.length > 1) history.back();
      else location.href = E.link('device-e50.html');
    };
  })();
  </script>
</body></html>
