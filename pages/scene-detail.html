<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>场景详情</title><link rel="stylesheet" href="../assets/app/app.css">
<style>
  .scene-hero { padding: 16px; display: grid; gap: 9px; justify-items: start; }
  .scene-hero h1 { margin: 0; font-size: 18px; line-height: 1.5; }
  .scene-meta { display: flex; flex-wrap: wrap; gap: 7px; }
  .scene-meta span { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
  .scene-meta .scene-ac { background: var(--blue-soft); color: var(--blue); }
  .scene-meta .scene-gw { border: 1px solid var(--line); color: var(--ink); }
  .scene-video { width: 100%; margin-bottom: 10px; text-align: left; }
  .scene-sec { padding: 14px 15px; margin-bottom: 10px; }
  .scene-sec h2 { margin: 0 0 8px; font-size: 14px; }
  .scene-sec p { margin: 0; color: var(--ink); font-size: 12px; line-height: 1.8; }
  .scene-sec.scene-value h2 { color: #157a41; }
  .scene-sec.scene-value p { color: #157a41; font-weight: 650; }
  .scene-product { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .scene-product:first-child { border-top: 0; }
  .scene-product img { flex: 0 0 auto; width: 58px; height: 44px; object-fit: contain; border-radius: 8px; background: #eef2f8; }
  .scene-product-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .scene-product-title { font-size: 13px; font-weight: 700; }
  .scene-product-desc { color: var(--muted); font-size: 11px; }
  .scene-product-arrow { color: var(--faint); font-size: 16px; }
</style>
</head>
<body>
  <main class="app-shell">
    <div class="statusbar"><span>17:41</span><span class="status-icons">● ● 68%</span></div>
    <header class="topbar"><a class="back" id="nav-back" href="tab-scene.html">‹</a><div class="topbar-title" id="scene-title">场景详情</div><div class="capsule">··· ○</div></header>
    <div class="page no-tab" id="scene-page"></div>
    <div class="toast" id="toast">视频播放</div>
  </main>
  <script src="../assets/app/product-data.js"></script>
  <script>
    (function () {
      var index = parseInt(new URLSearchParams(location.search).get('scene') || '0', 10);
      var scene = GWDBG_DATA.scenes[index];
      if (!scene) { location.replace('tab-scene.html'); return; }
      document.title = scene.title;
      document.getElementById('scene-title').textContent = scene.title;
      var products = scene.items.map(function (key) {
        var series = GWDBG_DATA.guideSeries.find(function (s) { return s.key === key; });
        var product = series && GWDBG_DATA.products.find(function (p) { return p.model === series.rep; });
        return series && product ? '<a class="scene-product" href="product-intro.html?series=' + series.key + '">' +
          '<img src="' + product.image + '" alt="' + series.title + '">' +
          '<span class="scene-product-main"><span class="scene-product-title">' + series.title + '</span><span class="scene-product-desc">' + series.desc + '</span></span>' +
          '<span class="scene-product-arrow">›</span></a>' : '';
      }).join('');
      document.getElementById('scene-page').innerHTML =
        '<section class="card scene-hero"><h1>' + scene.title + '</h1>' +
        '<div class="scene-meta"><span class="scene-ac">' + scene.ac + '</span><span class="scene-gw">网关：' + scene.products + '</span></div></section>' +
        '<button class="guide-card scene-video" id="scene-video" type="button"><span class="guide-thumb"><span class="guide-play"></span></span><span class="guide-card-title">' + scene.video + '</span></button>' +
        '<section class="card scene-sec"><h2>场景痛点</h2><p>' + scene.pain + '</p></section>' +
        '<section class="card scene-sec"><h2>解决方案</h2><p>' + scene.solution + '</p></section>' +
        '<section class="card scene-sec scene-value"><h2>落地价值</h2><p>' + scene.value + '</p></section>' +
        '<div class="section-label">涉及产品（点击查看产品方案介绍）</div>' +
        '<section class="card list-card">' + products + '</section>';
      var toast = document.getElementById('toast');
      document.getElementById('scene-video').addEventListener('click', function () {
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1300);
      });
      document.getElementById('nav-back').addEventListener('click', function (event) {
        if (window.history.length > 1) { event.preventDefault(); window.history.back(); }
      });
    })();
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
</body></html>
