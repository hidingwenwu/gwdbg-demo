<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FD01G</title><link rel="stylesheet" href="../assets/app/app.css"></head>
<body>
  <main class="app-shell workbench" id="fd-view">
    <div class="statusbar"><span>17:41</span><span class="status-icons">● ● 68%</span></div><div class="wb-hero-zone"><div class="hero-float-row"><button class="hero-back-pill" id="nav-back" type="button" aria-label="返回">‹</button><button class="hero-menu-float" id="menu-trigger" type="button" aria-label="打开菜单"><span class="hero-menu-icon">☰</span><span class="hero-menu-label">更多功能</span></button><div class="capsule">··· ○</div></div><div class="wb-hero-title" id="title">码库匹配</div></div><div class="page no-tab" id="content"></div>
    <div class="sheet-mask" id="control-mask"></div><section class="control-sheet" id="control-sheet"><div class="sheet-handle"></div><div class="sheet-heading"><div><h2>空调控制</h2><p>FD01G 红外控制</p></div><button class="sheet-close" id="sheet-close" type="button">×</button></div><div class="control-sheet-body"><div class="temp-stepper"><button id="temp-down" type="button">−</button><strong><span id="temp-value">26</span><small>℃</small></strong><button id="temp-up" type="button">+</button></div><div class="control-section"><span>运行模式</span><div class="chip-row" data-chip-group><button class="chip active">制冷</button><button class="chip">制热</button><button class="chip">除湿</button><button class="chip">送风</button><button class="chip">自动</button></div></div><div class="control-section"><span>风速</span><div class="chip-row" data-chip-group><button class="chip active">自动</button><button class="chip">低</button><button class="chip">中</button><button class="chip">高</button></div></div><label class="control-power switch-field"><span>空调开关</span><input type="checkbox" checked><i></i></label></div><button class="button primary sheet-confirm" id="send-control" type="button">发送红外指令</button></section>
    <div class="side-menu-overlay" id="side-menu-overlay"></div><aside class="side-menu-panel" id="side-menu" aria-label="设备功能"></aside><div class="toast" id="toast"></div>
  </main>
  <script src="../assets/app/product-data.js"></script><script src="../assets/app/connection-state.js"></script><script src="../assets/app/workbench.js"></script>
  <script>
  (function(){var context=window.GWDBG_WORKBENCH,q=new URLSearchParams(location.search),view=q.get('view')||'code';var views=['code','server','current','electric','control','learning','upgrade','reboot','reset'],titles={code:'码库匹配',server:'服务器设定',current:'电流检测',electric:'电量采集设置',control:'空调控制',learning:'红外学习',upgrade:'固件升级',reboot:'重启设备',reset:'恢复出厂设置'};if(views.indexOf(view)<0)view='code';document.getElementById('title').textContent=titles[view];
  function code(){return '<section class="card fd-code-card"><input class="search-input" id="brand-search" placeholder="品牌搜索" aria-label="品牌搜索"><div class="section-label">热门品牌</div><div class="brand-grid" id="brand-grid"><button class="brand-chip active" type="button">格力</button><button class="brand-chip" type="button">美的</button><button class="brand-chip" type="button">海尔</button><button class="brand-chip" type="button">奥克斯</button><button class="brand-chip" type="button">TCL</button><button class="brand-chip" type="button">大金</button><button class="brand-chip" type="button">松下</button><button class="brand-chip" type="button">海信</button><button class="brand-chip" type="button">三菱重工</button></div><div class="code-selector"><button id="prev-code" type="button">‹</button><div><small>当前码库</small><strong id="code-label">格力 · 第 1/8 套</strong></div><button id="next-code" type="button">›</button></div><button class="button primary" id="test-code" type="button" style="width:100%">下发码库测试指令</button><div class="match-result" id="match-result" hidden><span>空调是否正确响应？</span><div><button class="button" id="match-no" type="button">否，下一套</button><button class="button primary" id="match-yes" type="button">是，匹配成功</button></div></div></section>';}
  function server(){var protocols='<option>JSON</option><option>MODBUSTCP_V2.6</option><option>MODBUSRTU_V2.6</option>';return '<div class="server-tabs" role="tablist"><button class="server-tab active" data-server-tab="ip" type="button">服务器 IP 配置</button><button class="server-tab" data-server-tab="domain" type="button">服务器域名配置</button></div>'+
    '<section class="card form-card server-pane active" data-server-pane="ip"><label class="switch-field"><span>启用服务器</span><input type="checkbox" checked><i></i></label><div class="field"><label>服务器类型</label><select><option>云端 MQTT</option><option>本地 TCP</option></select></div><div class="field"><label>协议类型</label><select>'+protocols+'</select></div><div class="field"><label>服务器 IP</label><input value="192.168.1.188" inputmode="decimal"></div><div class="field"><label>端口</label><input value="1883" inputmode="numeric"></div><div class="field"><label>用户名</label><input value="feiyi_gateway"></div><div class="field"><label>密码</label><input type="password" value="12345678"></div><div class="field"><label>发布主题</label><input value="fy/device/up"></div><div class="field"><label>订阅主题</label><input value="fy/device/down"></div></section>'+
    '<section class="card form-card server-pane" data-server-pane="domain"><label class="switch-field"><span>启用服务器</span><input type="checkbox" checked><i></i></label><div class="field"><label>服务器类型</label><select><option>云端 MQTT</option><option>本地 TCP</option></select></div><div class="field"><label>协议类型</label><select>'+protocols+'</select></div><div class="field"><label>服务器域名</label><input value="iot.feiyi-tech.com"></div><div class="field"><label>端口</label><input value="1883" inputmode="numeric"></div><div class="field"><label>用户名</label><input value="feiyi_gateway"></div><div class="field"><label>密码</label><input type="password" value="12345678"></div><div class="field"><label>发布主题</label><input value="fy/device/up"></div><div class="field"><label>订阅主题</label><input value="fy/device/down"></div></section>'+
    '<button class="button primary" id="save-server" type="button" style="width:100%;margin-top:12px">保存并检测通讯</button><div class="result-box" id="server-result" hidden></div>';}
  function current(){return '<section class="card current-panel"><div class="current-value"><span id="current-number">318</span><small>mA</small></div><p id="detect-status">设备实时电流</p><div class="current-chart" id="current-chart"><i style="height:24%"></i><i style="height:30%"></i><i style="height:28%"></i><i style="height:36%"></i><i style="height:32%"></i><i style="height:44%"></i><i style="height:40%"></i><i style="height:46%"></i><i style="height:43%"></i><i style="height:51%"></i><i style="height:48%"></i><i style="height:54%"></i></div><div class="detect-progress"><span id="detect-progress"></span></div><button class="button primary" id="detect" style="width:100%">一键电流检测</button></section><div class="section-label">检测结果</div><section class="card parameter-card"><div class="parameter-row"><span>关机电流</span><strong>42 mA</strong></div><div class="parameter-row"><span>运行电流</span><strong>318 mA</strong></div><div class="parameter-row"><span>电流阈值</span><strong>420 mA</strong></div><div class="parameter-row"><span>运行判定</span><strong>待机</strong></div></section>';}
  function electric(){return '<div class="section-label">实时电量</div><section class="card parameter-card"><div class="parameter-row"><span>供电电压</span><strong>220.8 V</strong></div><div class="parameter-row"><span>实时电流</span><strong>318 mA</strong></div><div class="parameter-row"><span>有功功率</span><strong>68.4 W</strong></div><div class="parameter-row"><span>累计电量</span><strong>126.7 kWh</strong></div></section><div class="section-label">电量采集配置</div><section class="card form-card"><label class="switch-field"><span>启用电量采集</span><input type="checkbox" checked><i></i></label><div class="field"><label>采集周期</label><select><option>60 秒</option><option>30 秒</option><option>5 分钟</option></select></div><div class="field"><label>电流校准系数</label><input value="1.000"></div><div class="field"><label>电压校准系数</label><input value="1.000"></div><div class="field"><label>功率校准系数</label><input value="1.000"></div></section><button class="button primary" id="save-electric" style="width:100%;margin-top:12px">保存采集配置</button><div class="section-label">电流阈值</div><section class="card form-card"><div class="field"><label>电流阈值</label><input id="electric-threshold" type="number" min="50" value="420" inputmode="numeric"></div></section><button class="button" id="save-current" style="width:100%;margin-top:12px">单独保存电流阈值</button>';}
  function control(){return '<section class="card fd-ac-card"><div class="fd-ac-head"><div class="unit-machine"><i></i></div><span class="connection-badge">在线</span></div><h2>分体空调</h2><p>当前码库：格力 · 第 1 套</p><div class="fd-ac-state"><strong>26℃</strong><span>制冷<br>自动风</span></div><button class="button primary" id="open-control" style="width:100%">空调控制</button><div class="action-bar"><a class="button" href="'+context.link('device-fd01g-view.html',{view:'code'})+'">码库匹配</a><a class="button" href="'+context.link('device-fd01g-view.html',{view:'learning'})+'">红外学习</a></div></section>';}
  function learning(){return '<section class="card learning-card"><div class="learning-signal"><i></i><i></i><i></i></div><h2>红外按键学习</h2><div class="field"><label>学习按键</label><select id="learning-key"><option>开/关机</option><option>制冷</option><option>制热</option><option>温度 +</option><option>温度 −</option><option>风速</option></select></div><ol class="learning-steps"><li>将原装遥控器对准设备红外接收窗</li><li>开始学习后按下对应遥控器按键</li><li>识别完成后保存当前按键</li></ol><button class="button primary" id="learn" style="width:100%">开始学习</button><div class="result-box" id="learn-result" hidden></div></section>';}
  function upgrade(){return '<div class="section-label">固件版本</div><section class="card parameter-card"><div class="parameter-row"><span>当前版本</span><strong>FD01G V1.8.2</strong></div><div class="parameter-row"><span>最新版本</span><strong>V1.8.5</strong></div><div class="parameter-row"><span>升级包大小</span><strong>2.4 MB</strong></div></section><button class="button primary" id="upgrade" style="width:100%;margin-top:14px">开始升级</button>';}
  function reboot(){return '<section class="card form-card"><div class="field"><label>设备重启</label><p class="field-note" style="margin:0">重启过程中设备将短暂离线，约 30 秒后自动恢复连接，已保存的配置不受影响。</p></div></section><button class="button primary" id="reboot" style="width:100%;margin-top:14px">重启设备</button>';}
  function reset(){return '<section class="card warning-block"><strong>恢复出厂设置</strong><p>设备参数将全部恢复为出厂状态（含码库、服务器、电量采集配置），恢复后需重新调试。</p></section><button class="button primary" id="reset" style="width:100%;margin-top:14px">恢复出厂设置</button>';}
  var screens={code:code,server:server,current:current,electric:electric,control:control,learning:learning,upgrade:upgrade,reboot:reboot,reset:reset};document.getElementById('content').innerHTML=screens[view]();
  function showToast(message){var toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show');},1500);}
  
  var current2=1,total=8,brand='格力';var codeLabel=document.getElementById('code-label');
  function updateCode(){if(!codeLabel)return;codeLabel.textContent=brand+' · 第 '+current2+'/'+total+' 套';document.getElementById('match-result').hidden=true;}
  var brandGrid=document.getElementById('brand-grid');if(brandGrid){brandGrid.onclick=function(event){var chip=event.target.closest('.brand-chip');if(!chip)return;brandGrid.querySelectorAll('.brand-chip').forEach(function(item){item.classList.toggle('active',item===chip);});brand=chip.textContent;current2=1;updateCode();};
  document.getElementById('brand-search').oninput=function(event){brandGrid.querySelectorAll('.brand-chip').forEach(function(chip){chip.hidden=!chip.textContent.toLowerCase().includes(event.target.value.trim().toLowerCase());});};
  document.getElementById('prev-code').onclick=function(){current2=Math.max(1,current2-1);updateCode();};
  document.getElementById('next-code').onclick=function(){current2=Math.min(total,current2+1);updateCode();};
  document.getElementById('test-code').onclick=function(){var result=document.getElementById('match-result');result.hidden=false;result.scrollIntoView({behavior:'smooth',block:'nearest'});};
  document.getElementById('match-no').onclick=function(){if(current2<total){current2+=1;updateCode();showToast('已切换下一套码库');}else showToast('已无更多码库可切换');};
  document.getElementById('match-yes').onclick=function(){document.getElementById('match-result').innerHTML='<strong class="match-success">✓ 码库匹配成功</strong>';showToast('码库配置已保存');};}
  
  document.querySelectorAll('[data-server-tab]').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('[data-server-tab]').forEach(function(item){item.classList.toggle('active',item===tab);});document.querySelectorAll('[data-server-pane]').forEach(function(pane){pane.classList.toggle('active',pane.dataset.serverPane===tab.dataset.serverTab);});});});
  var saveServer=document.getElementById('save-server');if(saveServer)saveServer.onclick=function(){var result=document.getElementById('server-result');result.hidden=false;saveServer.disabled=true;result.textContent='检测通讯中';result.className='result-box checking';setTimeout(function(){result.textContent='通讯正常，服务器配置已保存';result.className='result-box success';saveServer.disabled=false;},900);};
  
  var sheet=document.getElementById('control-sheet'),mask=document.getElementById('control-mask');function openControl(){sheet.classList.add('show');mask.classList.add('show');}function closeControl(){sheet.classList.remove('show');mask.classList.remove('show');}mask.onclick=closeControl;document.getElementById('sheet-close').onclick=closeControl;var open=document.getElementById('open-control');if(open)open.onclick=openControl;document.querySelectorAll('[data-chip-group]').forEach(function(group){group.onclick=function(event){var chip=event.target.closest('.chip');if(!chip)return;group.querySelectorAll('.chip').forEach(function(item){item.classList.toggle('active',item===chip);});};});document.getElementById('temp-down').onclick=function(){var el=document.getElementById('temp-value');el.textContent=Math.max(16,+el.textContent-1);};document.getElementById('temp-up').onclick=function(){var el=document.getElementById('temp-value');el.textContent=Math.min(30,+el.textContent+1);};document.getElementById('send-control').onclick=function(){closeControl();showToast('红外控制指令已发送');};
  
  var learn=document.getElementById('learn');if(learn)learn.onclick=function(){var result=document.getElementById('learn-result');learn.disabled=true;learn.textContent='等待遥控器按键';result.hidden=false;result.textContent='正在接收红外信号';setTimeout(function(){learn.disabled=false;learn.textContent='重新学习';result.textContent='红外按键识别成功，已保存';result.className='result-box success';},1000);};
  var detect=document.getElementById('detect');if(detect)detect.onclick=function(){var progress=0,bar=document.getElementById('detect-progress'),status=document.getElementById('detect-status');detect.disabled=true;var timer=setInterval(function(){progress+=10;bar.style.width=progress+'%';status.textContent='电流检测中 · '+progress+'%';document.getElementById('current-number').textContent=318+Math.round(Math.random()*18);if(progress>=100){clearInterval(timer);status.textContent='电流检测完成，曲线已生成';detect.disabled=false;detect.textContent='重新检测';showToast('电流检测完成');}},100);};
  var saveElectric=document.getElementById('save-electric');if(saveElectric)saveElectric.onclick=function(){showToast('电量采集配置已保存');};
  var saveCurrent=document.getElementById('save-current');if(saveCurrent)saveCurrent.onclick=function(){if(+document.getElementById('electric-threshold').value<50){showToast('电流阈值必须不小于 50 mA');return;}showToast('电流阈值已保存');};
  var upgradeBtn=document.getElementById('upgrade');if(upgradeBtn)upgradeBtn.onclick=function(){upgradeBtn.disabled=true;upgradeBtn.textContent='升级中 · 48%';setTimeout(function(){upgradeBtn.textContent='升级完成';showToast('固件已更新至 V1.8.5');},900);};
  
  var rebootBtn=document.getElementById('reboot');if(rebootBtn)rebootBtn.onclick=function(){context.showConfirm('重启设备','设备将短暂离线并重新启动，约 30 秒后自动恢复连接。',function(){rebootBtn.disabled=true;rebootBtn.textContent='设备重启中…';setTimeout(function(){rebootBtn.disabled=false;rebootBtn.textContent='重启设备';showToast('设备已重启，正在重新连接');},1500);});};
  var resetBtn=document.getElementById('reset');if(resetBtn)resetBtn.onclick=function(){context.showConfirm('恢复出厂设置','设备参数将全部恢复为出厂状态，恢复后需重新调试。',function(){resetBtn.disabled=true;resetBtn.textContent='正在恢复…';setTimeout(function(){resetBtn.disabled=false;resetBtn.textContent='恢复出厂设置';showToast('已恢复出厂设置，设备重启中');},1500);});};
  })();
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
</body></html>
