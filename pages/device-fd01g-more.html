<body>

    <div class="wb-hero-zone"><div class="hero-float-row"><button class="hero-back-pill" id="nav-back" type="button" aria-label="返回">‹</button><button class="hero-menu-float" id="menu-trigger" type="button" aria-label="打开菜单"><span class="hero-menu-icon">☰</span><span class="hero-menu-label">更多功能</span></button><div class="capsule">··· ○</div></div><div class="wb-hero-title">更多配置</div></div>

      <section class="card hero-card"><div><div class="hero-model">FD01G</div><div class="hero-name"><span id="device-id">FD01G-7319E2</span></div><div class="hero-status-row"><span class="hero-status">已连接 · 蓝牙</span><button class="hero-disconnect" id="hero-disconnect" type="button">断开连接</button></div></div><div class="hero-side"><img class="hero-image" src="../assets/products/fd01g.png" alt="FD01G"><a class="hero-detail-link" id="detail-link" href="device-fd01g-detail.html">进入设备详情 ›</a></div></section>

      <section class="card list-card" id="more-settings">

  <script>
  (function(){
    var context = window.GWDBG_WORKBENCH;
    var legacyView = new URLSearchParams(location.search).get('view');
    if (legacyView) { location.replace(context.link('device-fd01g-view.html', { view: legacyView })); return; }
    document.getElementById('device-id').textContent = context.device;
    document.getElementById('hero-disconnect').onclick = context.confirmDisconnect;
    document.getElementById('detail-link').href = context.link('device-fd01g-detail.html');
    document.querySelectorAll('[data-fd01g-view]').forEach(function (link) {
      link.href = context.link('device-fd01g-view.html', { view: link.dataset.fd01gView });
    });
  })();
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
