<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>产品手册</title><link rel="stylesheet" href="../assets/app/app.css">
<style>
  .manual-hero { padding: 16px; display: grid; gap: 7px; justify-items: start; }
  .manual-hero .doc-badge { padding: 3px 8px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); font-size: 10px; font-weight: 700; }
  .manual-hero h1 { margin: 0; font-size: 17px; line-height: 1.5; }
  .manual-hero p { margin: 0; color: var(--muted); font-size: 11px; }
  .manual-toc { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0 4px; scrollbar-width: none; }
  .manual-toc::-webkit-scrollbar { display: none; }
  .manual-toc button { flex: 0 0 auto; min-height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 15px; background: #fff; color: var(--muted); font-size: 11px; cursor: pointer; }
  .manual-sec { padding: 14px 15px; margin-bottom: 10px; }
  .manual-sec h2 { margin: 0 0 8px; font-size: 14px; }
  .manual-sec p { margin: 0; color: var(--ink); font-size: 12px; line-height: 1.8; }
</style>
</head>
<body>
  <main class="app-shell">
    <div class="statusbar"><span>17:41</span><span class="status-icons">● ● 68%</span></div>
    <header class="topbar"><a class="back" id="nav-back" href="tool-guide.html">‹</a><div class="topbar-title" id="manual-title">产品手册</div><div class="capsule">··· ○</div></header>
    <div class="page no-tab" id="manual-page">
      <section class="card manual-hero" id="manual-hero"></section>
      <div class="manual-toc" id="manual-toc"></div>
      <div id="manual-body"></div>
    </div>
  </main>
  <script src="../assets/app/product-data.js"></script>
  <script src="../assets/app/manual-data.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var key = params.get('series');
      var docIndex = parseInt(params.get('doc') || '0', 10);
      var series = GWDBG_DATA.guideSeries.find(function (s) { return s.key === key; });
      var docPages = series && GWDBG_MANUALS[series.key];
      if (!series || !docPages || !series.docs[docIndex] || !docPages[docIndex]) {
        location.replace('product-intro.html?series=' + (series ? series.key : 'a01'));
        return;
      }
      var doc = series.docs[docIndex];
      var sections = docPages[docIndex];
      document.title = doc[1];
      document.getElementById('manual-title').textContent = doc[0];
      document.getElementById('nav-back').href = 'product-intro.html?series=' + series.key;
      document.getElementById('manual-hero').innerHTML =
        '<span class="doc-badge">' + doc[0] + '</span><h1>' + doc[1] + '</h1><p>' + series.title + ' · ' + series.desc + '</p>';
      document.getElementById('manual-toc').innerHTML = sections.map(function (sec, index) {
        return '<button type="button" data-sec="' + index + '">' + sec.title + '</button>';
      }).join('');
      document.getElementById('manual-body').innerHTML = sections.map(function (sec, index) {
        if (sec.rows) {
          return '<section class="card manual-sec" id="sec-' + index + '"><h2>' + sec.title + '</h2><div class="parameter-card">' +
            sec.rows.map(function (row) { return '<div class="parameter-row"><span>' + row[0] + '</span><strong>' + row[1] + '</strong></div>'; }).join('') +
            '</div></section>';
        }
        return '<section class="card manual-sec" id="sec-' + index + '"><h2>' + sec.title + '</h2><p>' + sec.text + '</p></section>';
      }).join('');
      document.getElementById('manual-toc').addEventListener('click', function (event) {
        var btn = event.target.closest('[data-sec]');
        if (!btn) return;
        var target = document.getElementById('sec-' + btn.dataset.sec);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      document.getElementById('nav-back').addEventListener('click', function (event) {
        if (window.history.length > 1) { event.preventDefault(); window.history.back(); }
      });
    })();
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
</body></html>
