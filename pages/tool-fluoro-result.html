<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支持查询 · 结果</title>
  <link rel="stylesheet" href="../_base.css">
  <style>
    .rs-hero { text-align: center; padding: 26px 16px 22px; }
    .rs-hero .icon-big {
      width: 64px; height: 64px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: var(--ios-green);
      color: #fff; font-size: 32px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(52, 199, 89, 0.28);
    }
    .rs-hero .rh-model { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
    .rs-hero .rh-brand { font-size: var(--fs-small); color: var(--text-secondary); margin-top: 4px; }
    .rs-hero .rh-verdict { margin-top: 10px; font-size: var(--fs-label); font-weight: 600; color: #1E7C42; }

    .gw-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .gw-card .gw-main { flex: 1; min-width: 0; }
    .gw-card .gw-name { font-size: var(--fs-body); font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .gw-card .gw-note { font-size: var(--fs-small); color: var(--text-secondary); margin-top: 3px; }

    .wk-status { padding: 2px 16px 6px; }
    .wk-status .kv-item { min-height: 46px; }
    .wk-status .kv-value { text-align: right; }
    .wk-status .sv-strong { font-size: var(--fs-body); font-weight: 600; }
    .wk-status .sv-support { color: #1E7C42; font-weight: 600; }
    .nameplate-card { padding: 14px 16px; }
    .nameplate-img {
      width: 100%; border-radius: 10px; display: block;
      border: 0.5px solid var(--line-soft);
    }
    .nameplate-cap {
      font-size: var(--fs-tiny); color: var(--text-secondary); text-align: center; margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="phone-shell">
<div class="phone-screen">

  <div class="wx-statusbar">
    <span>17:41</span>
    <span class="sb-right"><span>68%</span></span>
  </div>
  <div class="wx-navbar">
    <a class="nav-back" href="tool-fluoro-input.html">‹</a>
    <div class="nav-title">查询结果</div>
    <div class="nav-capsule">
      <span class="cap-dot"></span><span class="cap-dot"></span><span class="cap-dot"></span>
      <span class="cap-sep"></span><span class="cap-circle"></span>
    </div>
  </div>

  <div class="page-body no-tabbar has-footer-btn">

    <div class="card rs-hero">
      <div class="icon-big">✓</div>
      <div class="rh-model" id="rh-model">RUXYQ12BA</div>
      <div class="rh-brand" id="rh-brand">大金 · 多联机外机</div>
      <div class="rh-verdict">支持接入飞奕网关</div>
    </div>

    <div class="section-title"><span id="gw-section-title">适配网关</span></div>
    <div class="card">
      <div class="kv-list" id="gw-list"></div>
    </div>

    <div class="card" style="margin-top: 12px;">
      <div class="card-title"><span class="card-title-main">调试要点</span></div>
      <div class="kv-list" id="debug-points">
        <div class="kv-item"><span class="kv-label">接线位置</span><span class="kv-value">外机 F1/F2 端子</span></div>
        <a class="kv-item" href="tool-wiring.html"><span class="kv-label">空调接线</span><span class="kv-value kv-arrow text-brand" id="wiring-link">大金 VRV 接线图文</span></a>
        <a class="kv-item" href="tool-wiring.html"><span class="kv-label">主从判断</span><span class="kv-value kv-arrow text-brand" id="master-link">查看判断方法</span></a>
        <a class="kv-item" href="tool-videos.html"><span class="kv-label">安装调试视频</span><span class="kv-value kv-arrow text-brand">观看演示</span></a>
      </div>
    </div>

    <div class="text-secondary" style="font-size: var(--fs-tiny); padding: 4px 4px 0; line-height: 1.7;">
      数据基于飞奕适配库 2026-07 版；现场如遇通讯异常，请通过"留言反馈"提交型号与现象。
    </div>

  </div>

  <div class="footer-bar">
    <a class="btn btn-ghost" style="flex:1;" href="tool-fluoro-input.html">再查一个</a>
    <a class="btn btn-primary-solid" style="flex:1.5;" href="product-catalog.html">查看产品方案</a>
  </div>

</div>
</div>

  <script src="../interactions.js"></script>
  <script src="../assets/app/ai-assistant.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var brand = q.get('brand') || '大金';
      var model = q.get('model') || 'RUXYQ12BA';
      if (q.get('type') === 'water') {
        var catLabel = q.get('cat') === 'module' ? '风冷模块主机' : '螺杆离心主机';
        var byTstat = q.get('by') === 'tstat';
        var prog = 'YK_ELINK'; // 适配程序名由水机适配库返回，此处为示例值
        document.getElementById('rh-model').textContent = model;
        document.getElementById('rh-brand').textContent = brand + ' · ' + catLabel;
        document.querySelector('.rh-verdict').textContent = '支持接入飞奕控制器';
        document.getElementById('gw-section-title').textContent = '适配控制器';
        document.getElementById('gw-list').innerHTML =
          '<div class="kv-item"><div class="gw-main"><div class="gw-name">W系列控制器 <span class="badge badge-info">推荐</span></div><div class="gw-note">W系列控制器，支持各类水机机组接入。</div></div></div>';
        var wkProgRow = '<div class="kv-item"><span class="kv-label">程序名称</span><span class="kv-value sv-strong">' + prog + '</span></div>';
        var wkNameplate =
          '<div class="section-title"><span>机组铭牌</span></div>' +
          '<div class="card nameplate-card">' +
          '<img class="nameplate-img" src="../assets/products/waiji.png" alt="机组铭牌示意">' +
          '<div class="nameplate-cap">铭牌照片示意，实际以现场机组为准</div>' +
          '</div>';
        var wkDebug =
          '<div class="card" style="margin-top: 12px;">' +
          '<div class="card-title"><span class="card-title-main">调试要点</span></div>' +
          '<div class="kv-list">' +
          '<div class="kv-item"><span class="kv-label">接线位置</span><span class="kv-value">' + (byTstat ? '主机线控器通讯链路' : '主机主控板通讯端子') + '</span></div>' +
          '<a class="kv-item" href="tool-wiring.html?brand=' + encodeURIComponent(brand) + '"><span class="kv-label">主机接线</span><span class="kv-value kv-arrow text-brand">' + brand + ' 接线图文</span></a>' +
          '<div class="kv-item"><span class="kv-label">通讯协议</span><span class="kv-value">Modbus RTU（按品牌适配）</span></div>' +
          '<a class="kv-item" href="tool-videos.html"><span class="kv-label">安装调试视频</span><span class="kv-value kv-arrow text-brand">观看演示</span></a>' +
          '</div></div>';
        document.querySelector('.page-body').insertAdjacentHTML('beforeend',
          '<div class="section-title"><span>设备支持情况</span></div>' +
          '<div class="card wk-status">' +
          '<div class="kv-list">' +
          '<div class="kv-item"><span class="kv-label">支持情况</span><span class="kv-value sv-support">支持此型号</span></div>' +
          '<div class="kv-item"><span class="kv-label">输入型号</span><span class="kv-value sv-strong">' + model + '</span></div>' +
          '<div class="kv-item"><span class="kv-label">空调品牌</span><span class="kv-value">' + brand + '</span></div>' +
          '<div class="kv-item"><span class="kv-label">主机型号</span><span class="kv-value">' + model + '</span></div>' +
          wkProgRow +
          '</div></div>' +
          wkNameplate + wkDebug
        );
        document.getElementById('debug-points').closest('.card').remove();
        return;
      }
      document.getElementById('rh-model').textContent = model;
      document.getElementById('rh-brand').textContent = brand + ' · 多联机外机';
      document.getElementById('wiring-link').textContent = brand + ' 接线图文';
      document.getElementById('wiring-link').closest('a').href = 'tool-wiring.html?brand=' + encodeURIComponent(brand);
      document.getElementById('master-link').closest('a').href = 'tool-wiring.html?brand=' + encodeURIComponent(brand);

      var GW_DATA = {
        vrf: {
          rows: [
            { name: 'A系列智能控制器', badge: '推荐', note: 'A系列网关支持一台网关接入多路空调系统，多联机集控接入主力机型。' },
            { name: 'S74G控制器', note: '单路室外网关，小体量项目轻量接入' }
          ]
        },
        duct: {
          rows: [{ name: 'B25LG线控网关', note: '风管机线控网关，按台接入' }]
        },
        water: {
          rows: [{ name: 'W系列控制器', note: 'W系列控制器，支持各类水机机组接入。' }]
        }
      };
      function renderGw(type) {
        var d = GW_DATA[type];
        document.getElementById('gw-list').innerHTML = d.rows.map(function (r) {
          return '<div class="kv-item"><div class="gw-main"><div class="gw-name">' + r.name +
            (r.badge ? ' <span class="badge badge-info">' + r.badge + '</span>' : '') +
            '</div><div class="gw-note">' + r.note + '</div></div></div>';
        }).join('');
      }
      renderGw(q.get('mtype') === 'duct' ? 'duct' : 'vrf');
    })();
  </script>
</body>
</html>
