<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>操作指引</title><link rel="stylesheet" href="../assets/app/app.css">
<style>
  .series-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .series-row:first-child { border-top: 0; }
  .series-img { flex: 0 0 auto; width: 58px; height: 44px; object-fit: contain; border-radius: 8px; background: #eef2f8; }
  .series-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
  .series-title { font-size: 14px; font-weight: 700; }
  .series-desc { color: var(--muted); font-size: 11px; }
  .series-arrow { color: var(--faint); font-size: 17px; }
  .cat-icon { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: var(--blue-soft); color: var(--blue); font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
  <main class="app-shell">
    <div class="statusbar"><span>17:41</span><span class="status-icons">● ● 68%</span></div>
    <header class="topbar"><a class="back" id="nav-back" href="tab-tools.html">‹</a><div class="topbar-title">操作指引</div><div class="capsule">··· ○</div></header>
    <div class="page no-tab">
      <div class="section-label">硬件产品专栏</div>
      <section class="card list-card" id="series-list"></section>
      <div class="section-label">平台操作专栏</div>
      <section class="card list-card" id="platform-list"></section>
    </div>
  </main>
  <script src="../assets/app/product-data.js"></script>
  <script>
    document.getElementById('series-list').innerHTML = GWDBG_DATA.guideSeries.map(function (s) {
      var product = GWDBG_DATA.products.find(function (p) { return p.model === s.rep; });
      return '<a class="series-row" href="product-intro.html?series=' + s.key + '">' +
        '<img class="series-img" src="' + product.image + '" alt="' + s.title + '">' +
        '<span class="series-main"><span class="series-title">' + s.title + '</span><span class="series-desc">' + s.desc + '</span></span>' +
        '<span class="series-arrow">›</span></a>';
    }).join('');
    document.getElementById('platform-list').innerHTML = GWDBG_DATA.platformGuideCats.map(function (c) {
      return '<a class="series-row" href="platform-videos.html?cat=' + c.key + '">' +
        '<span class="cat-icon">' + c.icon + '</span>' +
        '<span class="series-main"><span class="series-title">' + c.title + '</span><span class="series-desc">' + c.videos.length + ' 个视频</span></span>' +
        '<span class="series-arrow">›</span></a>';
    }).join('');
    document.getElementById('nav-back').addEventListener('click', function (event) {
      if (window.history.length > 1) { event.preventDefault(); window.history.back(); }
    });
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
</body></html>
