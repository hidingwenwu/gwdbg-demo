<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>场景</title><link rel="stylesheet" href="../assets/app/app.css">
<style>
  .scene-intro { margin: 4px 2px 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .scene-list { display: grid; gap: 10px; }
  .scene-card { display: grid; gap: 9px; padding: 14px 15px; }
  .scene-card > strong { font-size: 15px; }
  .scene-meta { display: flex; flex-wrap: wrap; gap: 7px; }
  .scene-meta span { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
  .scene-meta .scene-ac { background: var(--blue-soft); color: var(--blue); }
  .scene-meta .scene-gw { border: 1px solid var(--line); color: var(--ink); }
  .scene-row { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start; }
  .scene-row b { padding: 2px 0; border-radius: 5px; background: #f2f5fa; color: var(--muted); font-size: 10px; text-align: center; }
  .scene-row p { margin: 0; color: var(--ink); font-size: 12px; line-height: 1.65; }
  .scene-row.scene-value b { background: #e8f7ef; color: #1a9e56; }
  .scene-row.scene-value p { color: #157a41; font-weight: 650; }
</style>
</head>
<body>
  <main class="app-shell">
    <div class="statusbar"><span>17:41</span><span class="status-icons">● ● 68%</span></div>
    <header class="topbar home"><div class="topbar-title">场景</div><div class="capsule">··· ○</div></header>
    <div class="page">
      <div class="scene-intro">飞奕空调智能网关在各行业场景的落地应用：从场景痛点到解决方案与落地价值。</div>
      <div class="scene-list" id="scene-list"></div>
    </div>
    <nav class="tabbar">
      <a class="tab" href="tab-device-bt.html">设备</a>
      <a class="tab" href="tab-tools.html">工具</a>
      <a class="tab active" href="tab-scene.html">场景</a>
      <a class="tab" href="tab-mine.html">我的</a>
    </nav>
  </main>
  <script src="../assets/app/product-data.js"></script>
  <script>
    document.getElementById('scene-list').innerHTML = GWDBG_DATA.scenes.map(function (s) {
      return '<section class="card scene-card"><strong>' + s.title + '</strong>' +
        '<div class="scene-meta"><span class="scene-ac">' + s.ac + '</span><span class="scene-gw">网关：' + s.products + '</span></div>' +
        '<div class="scene-row"><b>痛点</b><p>' + s.pain + '</p></div>' +
        '<div class="scene-row"><b>方案</b><p>' + s.solution + '</p></div>' +
        '<div class="scene-row scene-value"><b>价值</b><p>' + s.value + '</p></div></section>';
    }).join('');
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
</body>
</html>
