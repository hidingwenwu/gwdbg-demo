<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安装调试视频</title>
  <link rel="stylesheet" href="../_base.css">
  <style>
    .filter-row { margin-bottom: 16px; }

    .video-card { display: flex; gap: 12px; padding: 12px; }
    .video-card .v-thumb {
      width: 120px; height: 80px;
      border-radius: var(--radius-ios);
      background: linear-gradient(135deg, #2A3550, #1B2233);
      position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .video-card .v-play {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: flex; align-items: center; justify-content: center;
    }
    .video-card .v-play .tri {
      width: 0; height: 0; margin-left: 2px;
      border-left: 10px solid var(--fy-blue);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }
    .video-card .v-dur {
      position: absolute; right: 5px; bottom: 5px;
      background: rgba(0, 0, 0, 0.55); color: #fff;
      font-size: 10px; padding: 1px 5px; border-radius: 4px;
    }
    .video-card .v-body {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 2px 0;
    }
    .video-card .v-title {
      font-size: var(--fs-label); font-weight: 600; line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-card .v-meta { font-size: var(--fs-tiny); color: var(--text-secondary); }
  </style>
</head>
<body>

<div class="phone-shell">
<div class="phone-screen">

  <div class="wx-statusbar">
    <span>17:41</span>
    <span class="sb-right"><span>68%</span></span>

      <span class="cap-sep"></span><span class="cap-circle"></span>

  </div>

  <div class="page-body no-tabbar">

    <div class="filter-row chip-group" data-select="single">
      <span class="chip active">全部</span>
      <span class="chip">集控主机</span>
      <span class="chip">线控/温控器</span>

    <a class="card video-card press" href="#" onclick="showToast('正在播放');return false;">

  </div>

</div>
</div>

  <script src="../interactions.js"></script>
  <script src="../assets/app/ai-assistant.js"></script>
</body>
</html>
