<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FD01G 调试</title><link rel="stylesheet" href="../assets/app/app.css">
<style>
  .hero-find { margin-top: 12px; width: 100%; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #c6d6f5; border-radius: 9px; background: #fff; color: var(--blue); font-size: 13px; font-weight: 700; cursor: pointer; }
  .hero-find small { color: var(--muted); font-size: 10px; font-weight: 500; }
  .hero-find.finding { border-color: var(--blue); background: var(--blue-soft); }
  .hero-find:disabled { cursor: default; }
</style>
</head>
<body>
  <main class="app-shell workbench" id="fd-home">
    <div class="statusbar"><span>17:41</span><span class="status-icons">● ● 68%</span></div>
    <div class="wb-hero-zone"><div class="hero-float-row"><button class="hero-back-pill" id="nav-back" type="button" aria-label="返回">‹</button><button class="hero-menu-float" id="menu-trigger" type="button" aria-label="打开菜单"><span class="hero-menu-icon">☰</span><span class="hero-menu-label">更多功能</span></button><a class="hero-menu-float" id="guide-link" href="product-intro.html?series=fd01g"><span class="hero-menu-label">操作指引</span><span class="hero-menu-icon">▶</span></a><div class="capsule">··· ○</div></div><div class="wb-hero-title">快速配置</div></div>
    <div class="page no-tab">
      <section class="card hero-card"><div><div class="hero-model">FD01G</div><div class="hero-name">分体空调控制器<br><span id="device-id">FD01G-7319E2</span></div><div class="hero-status-row"><span class="hero-status">已连接 · 蓝牙</span><button class="hero-disconnect" id="hero-disconnect" type="button">断开连接</button></div><button class="hero-find" id="hero-find" type="button">寻找设备<small>按下后设备蜂鸣 3 轮</small></button></div><div class="hero-side"><img class="hero-image" src="../assets/products/fd01g.png" alt="FD01G"><a class="hero-detail-link" id="detail-link" href="device-fd01g-detail.html">进入设备详情 ›</a></div></section>
      <div class="section-label">快速配置</div>
      <section class="card task-card" id="quick-tasks">
        <a class="task-row" data-fd01g-view="code" href="device-fd01g-view.html?view=code"><span class="task-index">1</span><span><span class="task-title">码库匹配</span><span class="task-meta">红外码库选型与下发测试</span></span><span class="task-state">配置</span></a>
        <a class="task-row" data-fd01g-view="server" href="device-fd01g-view.html?view=server"><span class="task-index">2</span><span><span class="task-title">服务器设定</span><span class="task-meta">IP / 域名与协议配置</span></span><span class="task-state">配置</span></a>
        <a class="task-row" data-fd01g-view="current" href="device-fd01g-view.html?view=current"><span class="task-index">3</span><span><span class="task-title">电流检测</span><span class="task-meta">一键检测运行电流</span></span><span class="task-state">配置</span></a>
        <a class="task-row" data-fd01g-view="electric" href="device-fd01g-view.html?view=electric"><span class="task-index">4</span><span><span class="task-title">电量采集设置</span><span class="task-meta">采集周期与校准系数</span></span><span class="task-state">配置</span></a>
        <a class="task-row" data-fd01g-view="control" href="device-fd01g-view.html?view=control"><span class="task-index">5</span><span><span class="task-title">空调控制</span><span class="task-meta">开关 · 温度 · 模式 · 风速</span></span><span class="task-state">配置</span></a>
      </section>
      <div class="action-bar single"><a class="button primary" id="more-link" href="device-fd01g-more.html">更多配置</a></div>
    </div>
    <div class="side-menu-overlay" id="side-menu-overlay"></div><aside class="side-menu-panel" id="side-menu" aria-label="设备功能"></aside><div class="toast" id="toast"></div>
  </main>
  <script src="../assets/app/product-data.js"></script><script src="../assets/app/connection-state.js"></script><script src="../assets/app/workbench.js"></script>
  <script>
  (function(){
    var context = window.GWDBG_WORKBENCH;
    document.getElementById('device-id').textContent = context.device;
    document.getElementById('hero-disconnect').onclick = context.confirmDisconnect;
    document.getElementById('detail-link').href = context.link('device-fd01g-detail.html');
    document.getElementById('more-link').href = context.link('device-fd01g-more.html');
    document.querySelectorAll('[data-fd01g-view]').forEach(function (link) {
      link.href = context.link('device-fd01g-view.html', { view: link.dataset.fd01gView });
    });
    function showToast(message) { var toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(function () { toast.classList.remove('show'); }, 1500); }
    var findBtn = document.getElementById('hero-find');
    findBtn.onclick = function () {
      if (findBtn.disabled) return;
      findBtn.disabled = true;
      findBtn.classList.add('finding');
      var round = 0;
      var tick = function () {
        round += 1;
        if (round <= 3) {
          findBtn.textContent = '蜂鸣中 · 第 ' + round + '/3 轮';
          setTimeout(tick, 800);
          return;
        }
        findBtn.classList.remove('finding');
        findBtn.innerHTML = '寻找设备<small>按下后设备蜂鸣 3 轮</small>';
        findBtn.disabled = false;
        showToast('寻找完成，设备已蜂鸣 3 轮');
      };
      tick();
    };
  })();
  </script>
  <script src="../assets/app/ai-assistant.js"></script>
</body></html>
